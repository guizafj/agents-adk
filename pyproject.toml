[project]
name = "app"
version = "0.1.0"
description = "Este proyecto demuestra cómo integrar Google ADK (Agent Development Kit) con Ollama para crear aplicaciones conversacionales avanzadas que combinan lo mejor de ambos mundos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.14.1",
    "litellm>=1.83.7",
    "requests>=2.32.0",
    "python-dotenv>=1.1.1",
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "mcp>=1.28.1",
    "aiohttp>=3.14.3",
    "aiosqlite>=0.20.0",
    "filelock>=3.20.1",
    "authlib>=1.6.12",
    "pip-audit>=2.10.0",
    "ruff>=0.14.11",
    "bandit>=1.9.2",
    "pip>=26.1.2",
    "pre-commit>=4.5.1",
    "cryptography>=50.0.0",
    "idna>=3.15",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.27",
    "pydantic-settings>=2.14.2",
    "msgpack>=1.2.1",
    "click>=8.4.2",
    "sqlalchemy>=2.0.52",
    "pyasn1>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
